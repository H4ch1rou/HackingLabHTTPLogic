; Configuración PHP del laboratorio
; Las páginas hacen require_once 'bootstrap.php' → se busca en /src.
include_path = ".:/var/www/app/src"

display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

date.timezone = UTC

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
