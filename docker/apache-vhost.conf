<VirtualHost *:80>
    ServerName localhost
    # Solo /public es accesible por la web. /src, /seed y /data quedan fuera.
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        Options -Indexes +FollowSymLinks
        # .htaccess habilitado: lo usan los laboratorios de reconocimiento (RC-02).
        AllowOverride All
        Require all granted
    </Directory>

    # Archivos auxiliares de los labs (_session.php, _jwt.php): no accesibles directamente.
    <FilesMatch "^_.*\.php$">
        Require all denied
    </FilesMatch>

    # Pasar la cabecera Authorization a PHP (CR-02 usa Bearer tokens).
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
